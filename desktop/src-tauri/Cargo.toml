[package]
name = "verity-desktop"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin Tauri v2 native desktop shell for Verity"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
verity-core = { path = "../../crates/verity-core" }
verity-runtime = { path = "../../crates/verity-runtime" }
