name: Tests and lints

on:
  push:
    branches: [main, 'ci/verify/**']
  pull_request:

jobs:
  rust:
    name: Rust fmt, clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install bubblewrap for sandbox tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  frontend:
    name: Desktop UI typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: npm ci

      - name: Typecheck and build UI
        working-directory: desktop/ui
        run: npm run build

      - name: Run frontend state and rendering tests
        working-directory: desktop/ui
        run: node --test src/verify/piStore.laws.mjs src/verify/verificationViews.test.mjs

      - name: Install Rust for the CLI sidecar
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the installed Pi extension offline
        working-directory: desktop/ui
        run: |
          npm --prefix ../.. run sidecar:prepare
          npm exec --yes --package=@earendil-works/pi-coding-agent@1.5.2 -- node --test src/verify/piExtension.test.mjs
