name: Desktop build (Tauri v2)

on:
  push:
    branches: [main, 'ci/verify/**']
  pull_request:

jobs:
  desktop:
    name: Build Tauri v2 desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust toolchain
        if: matrix.os != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend
        working-directory: desktop/ui
        run: npm ci && npm run build

      - name: Check formatting (Tauri Rust shell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Build and stage the Verity CLI sidecar
        run: npm run sidecar:prepare

      - name: Run Clippy (Tauri Rust shell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests (Tauri Rust shell)
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build desktop executable with its CLI sidecar
        run: cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Verify Pi delegation tools with the CLI beside the desktop
        env:
          VERITY_TEST_CLI: ${{ github.workspace }}/desktop/src-tauri/target/debug/verity${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        run: npm exec --yes --package=@earendil-works/pi-coding-agent@1.5.2 -- node --test desktop/ui/src/verify/piExtension.test.mjs

      - name: Install pinned TLC
        if: matrix.os == 'ubuntu-latest'
        run: bash formal/tla/install-tool.sh "$RUNNER_TEMP/tla2tools.jar"

      - name: Check the restore model
        if: matrix.os == 'ubuntu-latest'
        working-directory: formal/tla/restore
        run: |
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -metadir "$RUNNER_TEMP/tlc-restore" -workers 1 -config Restore.cfg Restore.tla

      - name: Validate production restore traces
        if: matrix.os == 'ubuntu-latest'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$BASE_SHA" ] && \
            git diff --quiet "$BASE_SHA" HEAD -- desktop/ crates/ formal/ .github/workflows/ Cargo.toml Cargo.lock; then
            exit 0
          fi
          python3 formal/tla/restore/check_traces.py "$RUNNER_TEMP/tla2tools.jar"
