name: Desktop build (Tauri v2)

on:
  push:
    branches: [main, 'ci/verify/**']
  pull_request:

jobs:
  desktop:
    name: Build Tauri v2 desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust toolchain
        if: matrix.os != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend
        working-directory: desktop/ui
        run: npm ci && npm run build

      - name: Check formatting (Tauri Rust shell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Run Clippy (Tauri Rust shell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run tests (Tauri Rust shell)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Check Tauri Rust shell
        if: matrix.os != 'ubuntu-latest'
        working-directory: desktop/src-tauri
        run: cargo check
