name: Formal verification

on:
  push:
    branches: [main, 'ci/verify/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

jobs:
  tla-approval:
    name: TLA+ approval model and Git traces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pinned TLC
        run: bash formal/tla/install-tool.sh "$RUNNER_TEMP/tla2tools.jar"

      - name: Check the approval model
        working-directory: formal/tla/approval
        run: |
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -metadir "$RUNNER_TEMP/tlc-competing" -workers 1 -config Competing.cfg Approval.tla

      - name: Select extended approval checks
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$BASE_SHA" ] && \
            git diff --quiet "$BASE_SHA" HEAD -- crates/ formal/ .github/workflows/ Cargo.toml Cargo.lock; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check repeated task IDs and the freshness control
        if: steps.affected.outputs.run == 'true'
        working-directory: formal/tla/approval
        run: |
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -metadir "$RUNNER_TEMP/tlc-repeat" -workers 1 -config RepeatTask.cfg Approval.tla
          status=0
          java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" \
            -metadir "$RUNNER_TEMP/tlc-negative" -workers 1 -config LostUpdate.cfg Approval.tla \
            > "$RUNNER_TEMP/tlc-negative.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/tlc-negative.log"
          test "$status" -ne 0 && grep -F 'Invariant PreservesRefUpdates is violated.' "$RUNNER_TEMP/tlc-negative.log"

      - name: Install Rust toolchain
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Validate production approval traces
        if: steps.affected.outputs.run == 'true'
        shell: bash
        run: |
          VERITY_TLC_JAR="$RUNNER_TEMP/tla2tools.jar" cargo test --locked -p verity-runtime --lib \
            git::approval_trace::approval_model_and_production_traces -- --exact --ignored --nocapture \
            | tee "$RUNNER_TEMP/approval-traces.log"
          grep -Fx 'running 1 test' "$RUNNER_TEMP/approval-traces.log"

  kani:
    name: Kani proofs (formal/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and Kani
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            target
          key: kani-0.68.0-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'crates/verity-core/Cargo.toml', 'formal/Cargo.toml') }}

      - name: Install Kani 0.68.0
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.68.0
            cargo kani setup
          fi

      - name: Run Kani proofs on verity-formal
        run: cargo kani -p verity-formal

      - name: Install bubblewrap for the live verifier test
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Run both live Kani modes through the controller
        run: |
          checkers="$RUNNER_TEMP/verity-checkers"
          mkdir -p "$checkers"
          toolchain="$(cat "$HOME/.kani/kani-0.68.0/rust-toolchain-version")"
          rust_bin="$(dirname "$(rustup which --toolchain "$toolchain" rustc)")"
          for tool in kani cargo-kani; do
            cat > "$checkers/$tool" <<EOF
          #!/bin/sh
          export KANI_HOME="$HOME/.kani"
          export RUSTUP_HOME="$HOME/.rustup"
          export PATH="$HOME/.cargo/bin:$rust_bin:\$PATH"
          exec "$HOME/.cargo/bin/$tool" "\$@"
          EOF
            chmod +x "$checkers/$tool"
          done
          VERITY_KANI="$checkers/kani" VERITY_CARGO_KANI="$checkers/cargo-kani" \
            cargo test --locked -p verity-runtime --test phase3_e2e live_kani_approves -- --ignored --nocapture

  verus-scope:
    name: Verus scope proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select scope verification
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$BASE_SHA" ] && \
            git diff --quiet "$BASE_SHA" HEAD -- crates/ formal/ .github/workflows/ Cargo.toml Cargo.lock; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Verus and prove the scope decision
        if: steps.affected.outputs.run == 'true'
        run: |
          version=0.2026.11.22.1ce6a59
          archive="$RUNNER_TEMP/verus.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/verus-lang/verus/releases/download/release/$version/verus-$version-x86-linux.zip"
          printf '%s  %s\n' c955d5958877f4f907cce80aa996d4239a481984829d82e325938c7bf242b0db "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          rustup toolchain install 1.100.0 --profile minimal
          "$RUNNER_TEMP/verus-x86-linux/verus" --cfg verus_only --edition 2021 --crate-type lib \
            '-Zcrate-attr=feature(proc_macro_hygiene,sized_hierarchy)' --time crates/verity-core/src/lib.rs

  lean:
    name: Lean comparator (live Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build bubblewrap 0.11.1 for the Lean runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev meson ninja-build zstd
          source_dir="$RUNNER_TEMP/bubblewrap"
          archive="$RUNNER_TEMP/bubblewrap.tar.xz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/containers/bubblewrap/releases/download/v0.11.1/bubblewrap-0.11.1.tar.xz
          echo "c1b7455a1283b1295879a46d5f001dfd088c0bb0f238abb5e128b3583a246f71  $archive" | sha256sum --check
          mkdir -p "$source_dir"
          tar --extract --file "$archive" --directory "$source_dir" --strip-components=1
          meson setup --buildtype=release -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled -Dtests=false "$source_dir/build" "$source_dir"
          meson compile -C "$source_dir/build"
          sudo install -m755 "$source_dir/build/bwrap" /usr/bin/bwrap

      - name: Install Lean 4.35.0
        run: |
          archive="$RUNNER_TEMP/lean.tar.zst"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst
          echo "7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/lean" --strip-components=1

      - name: Run the live Lean comparator through the controller
        run: |
          lean_bin="$RUNNER_TEMP/lean/bin"
          export PATH="$lean_bin:$PATH"
          fixture="$RUNNER_TEMP/lean-challenge"
          mkdir -p "$fixture"
          (
            cd "$fixture"
            printf 'theorem smoke : True := by trivial\n' > Challenge.lean
            "$lean_bin/lean" -o Challenge.olean Challenge.lean
            LEAN_PATH="$fixture" "$lean_bin/leanexport" Challenge > challenge.export
            printf '%s\n' '{"challenge_module":"Challenge","solution_module":"Solution","theorem_names":["smoke"],"permitted_axioms":["propext","Quot.sound","Classical.choice"]}' > comparator.json
          )
          VERITY_LEAN_COMPARATOR="$lean_bin/lake" \
            VERITY_LEAN_COMPARATOR_CONFIG="$fixture/comparator.json" \
            VERITY_LEAN_CHALLENGE_EXPORT="$fixture/challenge.export" \
            cargo test --locked -p verity-runtime --test phase3_e2e live_lean_approves -- --ignored --nocapture
